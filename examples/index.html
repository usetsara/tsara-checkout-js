<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tsara Checkout JS example</title>
</head>
<body>
  <button id="pay" type="button">Pay with Tsara</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="../dist/index.global.js"></script>
  <script>
    const status = document.getElementById("status");
    document.getElementById("pay").addEventListener("click", () => {
      TsaraCheckout.open({
        publicKey: "pk_test_replace_me",
        transactionId: "order_001",
        checkoutUrl: "https://checkout.tsara.ng/",
        onLoad: () => { status.textContent = "Checkout loaded."; },
        onSuccess: result => { status.textContent = `Payment ${result.status}: ${result.transactionId}`; },
        onCancel: context => { status.textContent = `Checkout closed: ${context.reason}`; },
        onError: error => { status.textContent = error.message; },
      });
    });
  </script>
</body>
</html>
